services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: didaskey
      POSTGRES_USER: didaskey
      POSTGRES_PASSWORD: ${DIDASKEY_DB_PASSWORD:?Set DIDASKEY_DB_PASSWORD}
    volumes:
      - didaskey_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U didaskey"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./backend
    env_file: ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://didaskey:${DIDASKEY_DB_PASSWORD}@database:5432/didaskey
      ENVIRONMENT: production
      DEBUG: "false"
      SKIP_TUTOR_AVAILABILITY_CHECK: "false"
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8000:8000"
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
volumes:
  didaskey_database:
