<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport"
  content="width=device-width,initial-scale=1,maximum-scale=1,
           user-scalable=no,viewport-fit=cover"/>
<title>Didaskey Classroom</title>
<style>
/* ── Reset ──────────────────────────────────────────────────────────────────── */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0B3F43;
  font-family:-apple-system,Roboto,'Segoe UI',sans-serif}
button{border:none;cursor:pointer;font-family:inherit;background:none}

/* ── Root shell ─────────────────────────────────────────────────────────────── */
#app{position:fixed;inset:0;display:flex;flex-direction:column}

/* ── PIP strip (board mode) ─────────────────────────────────────────────────── */
#pip-strip{
  display:none;flex-shrink:0;flex-direction:row;
  gap:6px;padding:6px 6px 0;height:110px;
  overflow-x:auto;overflow-y:hidden;background:#0B3F43;
}

/* ── Video grid (video mode) ────────────────────────────────────────────────── */
#grid{
  flex:1;display:grid;gap:6px;padding:6px;
  grid-template-columns:1fr;align-content:stretch;overflow:hidden;
}

/* ── Shared tile style ──────────────────────────────────────────────────────── */
.tile{
  position:relative;background:#10262A;border-radius:14px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;min-height:80px;
}
#pip-strip .tile{flex:0 0 86px;height:96px;border-radius:10px;min-height:unset}
.tile video{width:100%;height:100%;object-fit:cover;background:#10262A}
.tile.no-video video{display:none}
.avatar{
  width:52px;height:52px;border-radius:50%;background:#17A389;
  color:#fff;font-size:18px;font-weight:700;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.tile-label{
  position:absolute;left:8px;bottom:8px;
  background:rgba(0,0,0,.55);color:#fff;font-size:11px;
  padding:3px 9px;border-radius:999px;
  display:flex;align-items:center;gap:4px;white-space:nowrap;
}
.mic-off-icon{color:#F2B544}

/* ── Board wrapper ──────────────────────────────────────────────────────────── */
#board-wrap{
  flex:1;position:relative;display:none;
  flex-direction:column;overflow:hidden;background:#FAFAF8;
}
#board-canvas{
  position:absolute;inset:0;width:100%;height:100%;
  touch-action:none;cursor:crosshair;display:block;
}
#pointer-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
#text-input{
  position:absolute;display:none;z-index:10;
  border:1.5px dashed #17A389;border-radius:4px;
  background:transparent;outline:none;resize:none;overflow:hidden;
  font-family:inherit;padding:2px 4px;
  min-width:80px;min-height:28px;line-height:1.4;
  white-space:pre;caret-color:#17A389;
}

/* ── Whiteboard toolbar ─────────────────────────────────────────────────────── */
#wb-toolbar{
  position:absolute;left:50%;transform:translateX(-50%);
  bottom:14px;z-index:20;
  display:none;flex-direction:row;align-items:center;gap:4px;
  background:rgba(11,63,67,.94);backdrop-filter:blur(12px);
  border:1px solid rgba(255,255,255,.12);border-radius:999px;
  padding:6px 10px;
  box-shadow:0 4px 24px rgba(0,0,0,.4);
  max-width:calc(100vw - 20px);overflow-x:auto;
}
#wb-toolbar::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:24px;background:rgba(255,255,255,.15);
  margin:0 3px;flex-shrink:0}
.tb-btn{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  color:#fff;font-size:14px;transition:background .15s;flex-shrink:0;
}
.tb-btn:active,.tb-btn:hover{background:rgba(255,255,255,.15)}
.tb-btn.active{background:rgba(23,163,137,.6);box-shadow:0 0 0 2px rgba(23,163,137,.4)}
.wi{display:block;width:18px;border-radius:999px;background:currentColor}
.tb-swatch{
  width:20px;height:20px;border-radius:50%;flex-shrink:0;
  border:2px solid transparent;cursor:pointer;transition:border-color .12s;
}
.tb-swatch.active{border-color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.4)}
#page-bar{display:flex;align-items:center;gap:5px;padding:0 2px}
.pg-dot{
  width:7px;height:7px;border-radius:50%;
  background:rgba(255,255,255,.3);cursor:pointer;
  transition:background .15s,width .15s;flex-shrink:0;
}
.pg-dot.active{background:#8EEED0;width:16px;border-radius:999px}
#add-pg{
  width:20px;height:20px;border-radius:50%;
  background:rgba(255,255,255,.18);color:#fff;
  font-size:14px;line-height:20px;text-align:center;
  cursor:pointer;flex-shrink:0;user-select:none;
}

/* ── Call controls ──────────────────────────────────────────────────────────── */
#controls{
  display:flex;align-items:center;justify-content:center;gap:12px;
  padding:12px 10px calc(12px + env(safe-area-inset-bottom));
  background:#08302F;flex-shrink:0;
}
.ctrl-btn{
  width:50px;height:50px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:19px;color:#fff;
  background:rgba(255,255,255,.14);transition:background .15s;
}
.ctrl-btn:active{background:rgba(255,255,255,.25)}
.ctrl-btn.off{background:#F2B544;color:#0B3F43}
.ctrl-btn.leave{background:#dc2626;width:58px}
.ctrl-btn.wb-active{background:rgba(23,163,137,.65)}
.ctrl-btn.hidden{display:none}

/* ── Status banner ──────────────────────────────────────────────────────────── */
#status-banner{
  position:absolute;top:12px;left:0;right:0;
  display:none;justify-content:center;z-index:40;pointer-events:none;
}
#status-banner span{
  background:rgba(0,0,0,.58);color:#fff;font-size:12px;
  padding:5px 14px;border-radius:999px;
}

/* ── Connecting overlay ─────────────────────────────────────────────────────── */
#connecting{
  position:absolute;inset:0;z-index:60;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0B3F43;color:#fff;gap:14px;
}
.spinner{
  width:32px;height:32px;border-radius:50%;
  border:3px solid rgba(255,255,255,.2);border-top-color:#8EEED0;
  animation:spin .75s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
#connecting p{font-size:13px;color:rgba(255,255,255,.65)}
</style>
</head>
<body>
<div id="app">

  <!-- Connecting overlay -->
  <div id="connecting">
    <div class="spinner"></div>
    <p>Preparing your classroom…</p>
  </div>

  <!-- Status banner -->
  <div id="status-banner"><span id="status-text"></span></div>

  <!-- PIP strip: visible in board mode -->
  <div id="pip-strip"></div>

  <!-- Video grid: visible in video mode -->
  <div id="grid"></div>

  <!-- Whiteboard panel: visible in board mode -->
  <div id="board-wrap">
    <canvas id="board-canvas"></canvas>
    <div id="pointer-layer"></div>
    <textarea id="text-input" rows="1"></textarea>
    <div id="wb-toolbar"></div>
  </div>

  <!-- Call controls: always visible -->
  <div id="controls">
    <button class="ctrl-btn" id="mic-btn"   title="Mute / unmute">🎤</button>
    <button class="ctrl-btn" id="cam-btn"   title="Camera on / off">📷</button>
    <button class="ctrl-btn hidden" id="share-btn" title="Share screen">🖥️</button>
    <button class="ctrl-btn" id="board-btn" title="Whiteboard">✏️</button>
    <button class="ctrl-btn leave" id="leave-btn" title="Leave">✕</button>
  </div>

</div><!-- #app -->

<!--
  LiveKit browser SDK — pinned to a stable v2 release.
  Loaded from jsDelivr so the page works without bundling.
-->
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.13.4/dist/livekit-client.umd.min.js"></script>

<script>
/*
 * DIDASKEY CLASSROOM — runtime script
 *
 * Config is injected by the React Native WebView via
 * injectedJavaScriptBeforeContentLoaded before this script runs:
 *
 *   window.__CLS = {
 *     livekitUrl:  string,   // wss://...
 *     token:       string,   // LiveKit JWT
 *     displayName: string,
 *     isTutor:     boolean,
 *   };
 */
(function () {
'use strict';

/* ── Wait for config then boot ─────────────────────────────────────────────── */
function boot() {
  console.log('[Classroom] Boot function called');
  console.log('[Classroom] window object keys:', Object.keys(window));
  console.log('[Classroom] window.__CLS:', window.__CLS);
  
  var cfg = window.__CLS;
  if (!cfg || !cfg.livekitUrl || !cfg.token) {
    /* Config not yet injected — retry once on next tick */
    console.log('[Classroom] Config not ready, retrying...', cfg);
    
    // Add a counter to prevent infinite retries
    if (!window.__bootAttempts) window.__bootAttempts = 0;
    window.__bootAttempts++;
    
    if (window.__bootAttempts > 200) { // 10 seconds max (50ms * 200)
      console.error('[Classroom] Config injection failed after 10 seconds');
      console.log('[Classroom] Requesting config via postMessage...');
      post({type:'request_config'});
      return;
    }
    
    setTimeout(boot, 50);
    return;
  }
  console.log('[Classroom] Config loaded:', {
    hasLivekitUrl: !!cfg.livekitUrl,
    hasToken: !!cfg.token,
    hasDisplayName: !!cfg.displayName,
    isTutor: cfg.isTutor,
    livekitUrl: cfg.livekitUrl
  });
  run(cfg.livekitUrl, cfg.token, cfg.displayName || 'Participant', !!cfg.isTutor);
}

// Listen for config from React Native
window.addEventListener('message', function(event) {
  try {
    var data = JSON.parse(event.data);
    if (data.type === 'config') {
      console.log('[Classroom] Received config via postMessage:', data);
      window.__CLS = data.config;
      if (!window.__bootStarted) {
        window.__bootStarted = true;
        boot();
      }
    }
  } catch (e) {
    // Ignore non-JSON messages
  }
});

/* ── Main classroom logic ───────────────────────────────────────────────────── */
function run(LIVEKIT_URL, TOKEN, DISPLAY_NAME, IS_TUTOR) {

var PALETTE       = ['#000000','#FFFFFF','#17A389','#F2B544',
                     '#EF4444','#3B82F6','#8B5CF6','#10B981'];
var ERASER_R      = 20;
var MAX_PAGES     = 10;
var POINTER_TTL   = 2000;

/* ── RN bridge ──────────────────────────────────────────────────────────────── */
function post(msg) {
  try {
    window.ReactNativeWebView &&
      window.ReactNativeWebView.postMessage(JSON.stringify(msg));
  } catch (_) {}
}

function setStatus(text) {
  var el = document.getElementById('status-banner');
  document.getElementById('status-text').textContent = text || '';
  el.style.display = text ? 'flex' : 'none';
}

function genId() {
  return Math.random().toString(36).slice(2,10) + Date.now().toString(36);
}
function initials(name) {
  var parts = (name||'?').trim().split(/\s+/);
  return ((parts[0]||'')[0]||'').toUpperCase() +
         (parts.length>1 ? (parts[parts.length-1]||'')[0]||'' : '').toUpperCase() || '?';
}

/* ── Layout ─────────────────────────────────────────────────────────────────── */
var layoutMode = 'video';

function applyMode(m, broadcast) {
  layoutMode = m;
  var isBoard = m === 'board';
  document.getElementById('grid').style.display       = isBoard ? 'none' : 'grid';
  document.getElementById('pip-strip').style.display  = isBoard ? 'flex' : 'none';
  document.getElementById('board-wrap').style.display = isBoard ? 'flex' : 'none';
  document.getElementById('wb-toolbar').style.display = isBoard ? 'flex' : 'none';
  document.getElementById('board-btn').classList.toggle('wb-active', isBoard);
  if (isBoard) {
    moveTiles('pip-strip');
    requestAnimationFrame(function () { resizeCanvas(); redrawAll(); });
  } else {
    moveTiles('grid');
    layoutGrid();
  }
  post({ type: 'mode', mode: m });
  if (broadcast) sendData({ v:1, type:'mode_change', uid:myId, mode:m });
}

/* ── Tiles ──────────────────────────────────────────────────────────────────── */
var tiles = {};
var room  = null;
var myId  = '';

function makeTile(identity, name, isLocal) {
  var tile = document.createElement('div');
  tile.className        = 'tile no-video';
  tile.dataset.identity = identity;
  var av = document.createElement('div');
  av.className   = 'avatar';
  av.textContent = initials(name);
  tile.appendChild(av);
  var lbl = document.createElement('div');
  lbl.className = 'tile-label';
  var nm = document.createElement('span');
  nm.textContent = isLocal ? name + ' (You)' : (name || identity);
  lbl.appendChild(nm);
  var mic = document.createElement('span');
  mic.className = 'mic-off-icon';
  mic.style.display = 'none';
  mic.textContent = '🔇';
  lbl.appendChild(mic);
  tile.appendChild(lbl);
  tile._avatar  = av;
  tile._micIcon = mic;
  return tile;
}

function ensureTile(identity, name, isLocal) {
  if (tiles[identity]) return tiles[identity].el;
  var el = makeTile(identity, name || identity, isLocal);
  tiles[identity] = { el:el, videoEl:null, audioEl:null };
  var parent = layoutMode === 'board'
    ? document.getElementById('pip-strip')
    : document.getElementById('grid');
  parent.appendChild(el);
  layoutGrid();
  return el;
}

function removeTile(identity) {
  var t = tiles[identity];
  if (!t) return;
  t.el.remove();
  delete tiles[identity];
  layoutGrid();
}

function moveTiles(targetId) {
  var target = document.getElementById(targetId);
  Object.values(tiles).forEach(function(t){ target.appendChild(t.el); });
}

function layoutGrid() {
  if (layoutMode !== 'video') return;
  var n    = Object.keys(tiles).length;
  var cols = n <= 1 ? 1 : n <= 4 ? 2 : 3;
  document.getElementById('grid').style.gridTemplateColumns = 'repeat('+cols+',1fr)';
  post({ type:'participantCount', count:n });
}

function attachTrack(identity, track, isLocal) {
  var t  = tiles[identity];
  if (!t) return;
  var LK = window.LivekitClient;
  if (track.kind === LK.Track.Kind.Video) {
    if (t.videoEl) t.videoEl.remove();
    var vel = track.attach();
    vel.style.cssText = 'width:100%;height:100%;object-fit:cover;background:#10262A';
    vel.setAttribute('playsinline','true');
    vel.muted = isLocal;
    t.el.insertBefore(vel, t.el.firstChild);
    t.el.classList.remove('no-video');
    if (t.el._avatar) t.el._avatar.style.display = 'none';
    t.videoEl = vel;
  } else if (track.kind === LK.Track.Kind.Audio && !isLocal) {
    if (t.audioEl) t.audioEl.remove();
    var ael = track.attach();
    ael.style.display = 'none';
    document.body.appendChild(ael);
    t.audioEl = ael;
  }
}

function detachTrack(identity, track) {
  var t  = tiles[identity];
  if (!t) return;
  var LK = window.LivekitClient;
  if (track.kind === LK.Track.Kind.Video && t.videoEl) {
    t.videoEl.remove();
    t.videoEl = null;
    t.el.classList.add('no-video');
    if (t.el._avatar) t.el._avatar.style.display = 'flex';
  } else if (track.kind === LK.Track.Kind.Audio && t.audioEl) {
    t.audioEl.remove();
    t.audioEl = null;
  }
}

/* ── Whiteboard state ───────────────────────────────────────────────────────── */
var pages = {}, pageOrder = [], currentPage = null;
var tool    = { name:'pen', color:'#000000', width:3, opacity:1.0 };
var drawing = false, liveStroke = null, liveShape = null;
var undoStack = [], remoteStrokes = {}, remotePointers = {};
var canvas = null, ctx = null, W = 0, H = 0;

function resizeCanvas() {
  var wrap = document.getElementById('board-wrap');
  W = (wrap && wrap.clientWidth  > 0 ? wrap.clientWidth  : window.innerWidth)  || window.innerWidth;
  H = (wrap && wrap.clientHeight > 0 ? wrap.clientHeight : window.innerHeight) || window.innerHeight;
  if (!W || !H) return;
  canvas.width  = W;
  canvas.height = H;
  redrawAll();
}

function nx(x){return x/W;} function ny(y){return y/H;}
function dx(n){return n*W;} function dy(n){return n*H;}

function drawSmooth(points) {
  if (points.length < 2) return;
  ctx.beginPath();
  var p0 = [dx(points[0][0]), dy(points[0][1])];
  ctx.moveTo(p0[0], p0[1]);
  for (var i = 1; i < points.length-1; i++) {
    var cp = [dx(points[i][0]),   dy(points[i][1])];
    var ep = [dx(points[i+1][0]), dy(points[i+1][1])];
    ctx.quadraticCurveTo(cp[0], cp[1], (cp[0]+ep[0])/2, (cp[1]+ep[1])/2);
  }
  var last = points[points.length-1];
  ctx.lineTo(dx(last[0]), dy(last[1]));
  ctx.stroke();
}

function renderEl(el) {
  ctx.save();
  if (el.type === 'stroke') {
    ctx.globalAlpha = el.opacity || 1;
    ctx.strokeStyle = el.color;
    ctx.lineWidth   = el.width;
    ctx.lineCap = ctx.lineJoin = 'round';
    drawSmooth(el.points);
  } else if (el.type === 'shape') {
    ctx.globalAlpha = 1; ctx.strokeStyle = el.color;
    ctx.lineWidth = el.width; ctx.lineCap = 'round';
    var x1=dx(el.x1),y1=dy(el.y1),x2=dx(el.x2),y2=dy(el.y2);
    ctx.beginPath();
    if (el.shape==='line'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    else if(el.shape==='rect'){ctx.strokeRect(x1,y1,x2-x1,y2-y1);}
    else if(el.shape==='circle'){
      var rx=Math.abs(x2-x1)/2,ry=Math.abs(y2-y1)/2;
      ctx.ellipse(Math.min(x1,x2)+rx,Math.min(y1,y2)+ry,rx||1,ry||1,0,0,Math.PI*2);
      ctx.stroke();
    }
  } else if (el.type === 'text') {
    ctx.globalAlpha = 1; ctx.fillStyle = el.color;
    ctx.font = (el.size||18)+'px -apple-system,Roboto,sans-serif';
    var tx=dx(el.x),ty=dy(el.y);
    (el.text||'').split('\n').forEach(function(line,i){
      ctx.fillText(line, tx, ty+i*(el.size||18)*1.4);
    });
  }
  ctx.restore();
}

function redrawAll() {
  if (!ctx||!W||!H) return;
  ctx.clearRect(0,0,W,H);
  ctx.fillStyle = '#FAFAF8';
  ctx.fillRect(0,0,W,H);
  var pg = pages[currentPage];
  if (pg) pg.elements.forEach(renderEl);
  if (liveShape) {
    ctx.save();
    ctx.globalAlpha=0.55; ctx.strokeStyle=tool.color;
    ctx.lineWidth=tool.width; ctx.lineCap='round'; ctx.setLineDash([5,4]);
    var x1=dx(liveShape.x1),y1=dy(liveShape.y1),x2=dx(liveShape.x2),y2=dy(liveShape.y2);
    ctx.beginPath();
    if(liveShape.shape==='line'){ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
    else if(liveShape.shape==='rect'){ctx.strokeRect(x1,y1,x2-x1,y2-y1);}
    else if(liveShape.shape==='circle'){
      var rx2=Math.abs(x2-x1)/2,ry2=Math.abs(y2-y1)/2;
      ctx.ellipse(Math.min(x1,x2)+rx2,Math.min(y1,y2)+ry2,rx2||1,ry2||1,0,0,Math.PI*2);
      ctx.stroke();
    }
    ctx.restore();
  }
}

/* ── Laser pointers ─────────────────────────────────────────────────────────── */
function showPointer(identity, pnx, pny, color, name) {
  if (layoutMode !== 'board') return;
  var layer = document.getElementById('pointer-layer');
  var rp = remotePointers[identity];
  if (!rp) {
    var dot = document.createElement('div');
    dot.style.cssText = 'position:absolute;width:14px;height:14px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;transition:left .08s,top .08s;';
    var lbl = document.createElement('div');
    lbl.style.cssText = 'position:absolute;left:16px;top:-3px;white-space:nowrap;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;border-radius:99px;pointer-events:none;';
    lbl.textContent = name || identity;
    dot.appendChild(lbl);
    layer.appendChild(dot);
    rp = { dot:dot, timer:null };
    remotePointers[identity] = rp;
  }
  rp.dot.style.left = (pnx*W)+'px';
  rp.dot.style.top  = (pny*H)+'px';
  rp.dot.style.background = color || '#EF4444';
  rp.dot.style.boxShadow  = '0 0 0 3px rgba(255,255,255,.35)';
  if (rp.timer) clearTimeout(rp.timer);
  rp.timer = setTimeout(function(){ hidePointer(identity); }, POINTER_TTL);
}
function hidePointer(identity) {
  var rp = remotePointers[identity];
  if (rp) { rp.dot.remove(); delete remotePointers[identity]; }
}

/* ── Eraser ─────────────────────────────────────────────────────────────────── */
function eraseAt(enx, eny) {
  var pg = pages[currentPage]; if (!pg) return;
  var ex=dx(enx),ey=dy(eny), toRemove=[];
  pg.elements.forEach(function(el){
    if(el.type==='stroke'){
      for(var i=0;i<el.points.length;i++){
        var ppx=dx(el.points[i][0])-ex, ppy=dy(el.points[i][1])-ey;
        if(Math.sqrt(ppx*ppx+ppy*ppy)<ERASER_R){toRemove.push(el.id);break;}
      }
    } else {
      var cx=dx((el.x1||el.x||0)+(el.x2||el.x||0))/2-ex;
      var cy=dy((el.y1||el.y||0)+(el.y2||el.y||0))/2-ey;
      if(Math.sqrt(cx*cx+cy*cy)<ERASER_R*2) toRemove.push(el.id);
    }
  });
  if(!toRemove.length) return;
  removeIds(currentPage, toRemove);
  sendData({v:1,type:'stroke_erase',uid:myId,pageId:currentPage,ids:toRemove});
  redrawAll();
}
function removeIds(pageId, ids) {
  var pg=pages[pageId]; if(!pg) return;
  var set={}; ids.forEach(function(id){set[id]=true;});
  pg.elements = pg.elements.filter(function(el){return !set[el.id];});
  undoStack   = undoStack.filter(function(id){return !set[id];});
}

/* ── Text input ─────────────────────────────────────────────────────────────── */
var textPos = [0,0];
function openTextInput(tnx, tny) {
  var ti = document.getElementById('text-input');
  ti.style.left=dx(tnx)+'px'; ti.style.top=dy(tny)+'px';
  ti.style.color=tool.color; ti.style.fontSize='18px';
  ti.style.display='block'; ti.value='';
  textPos=[tnx,tny];
  setTimeout(function(){ti.focus();},40);
}
function commitText() {
  var ti=document.getElementById('text-input');
  var text=ti.value.trim(); ti.style.display='none';
  if(!text) return;
  var id=genId();
  var el={id:id,type:'text',text:text,color:tool.color,size:18,x:textPos[0],y:textPos[1]};
  pages[currentPage].elements.push(el); undoStack.push(id);
  sendData({v:1,type:'text_add',uid:myId,pageId:currentPage,
            id:id,text:text,color:tool.color,size:18,x:textPos[0],y:textPos[1]});
  redrawAll();
}
document.getElementById('text-input').addEventListener('blur', commitText);
document.getElementById('text-input').addEventListener('keydown', function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commitText();}
});

/* ── Pages ──────────────────────────────────────────────────────────────────── */
function initPages() {
  var id=genId(); pages[id]={elements:[]}; pageOrder=[id]; currentPage=id;
}
function switchPage(pid, broadcast) {
  if(!pages[pid]) return;
  currentPage=pid; renderPageBar(); redrawAll();
  if(broadcast) sendData({v:1,type:'page_switch',uid:myId,pageId:pid});
}
function addPage(pid, broadcast) {
  if(pageOrder.length>=MAX_PAGES) return;
  var id=pid||genId(); pages[id]={elements:[]}; pageOrder.push(id);
  switchPage(id,false); renderPageBar();
  if(broadcast) sendData({v:1,type:'page_add',uid:myId,pageId:id});
}
function renderPageBar() {
  var bar=document.getElementById('page-bar'); if(!bar) return;
  bar.innerHTML='';
  pageOrder.forEach(function(pid){
    var dot=document.createElement('div');
    dot.className='pg-dot'+(pid===currentPage?' active':'');
    dot.addEventListener('click',function(){switchPage(pid,true);});
    bar.appendChild(dot);
  });
}

/* ── Draw events ────────────────────────────────────────────────────────────── */
function canvasXY(e) {
  var r=canvas.getBoundingClientRect();
  var src=e.changedTouches?e.changedTouches[0]:e;
  return [src.clientX-r.left, src.clientY-r.top];
}
function onDown(e) {
  if(document.getElementById('text-input').style.display!=='none') return;
  e.preventDefault();
  var xy=canvasXY(e), pnx=nx(xy[0]), pny=ny(xy[1]);
  if(tool.name==='eraser'){drawing=true;eraseAt(pnx,pny);return;}
  if(tool.name==='text'){openTextInput(pnx,pny);return;}
  if(tool.name==='laser'){
    drawing=true;
    sendData({v:1,type:'pointer_move',uid:myId,x:pnx,y:pny,color:'#EF4444'});
    return;
  }
  var isShape=tool.name==='line'||tool.name==='rect'||tool.name==='circle';
  if(isShape){
    drawing=true;
    liveShape={id:genId(),shape:tool.name,x1:pnx,y1:pny,x2:pnx,y2:pny,
               color:tool.color,width:tool.width};
    return;
  }
  drawing=true;
  var sid=genId();
  liveStroke={id:sid,type:'stroke',tool:tool.name,color:tool.color,
              width:tool.width,opacity:tool.name==='highlight'?0.35:1.0,
              points:[[pnx,pny]]};
  sendData({v:1,type:'stroke_start',uid:myId,pageId:currentPage,
            id:sid,tool:tool.name,color:tool.color,width:tool.width,
            opacity:liveStroke.opacity,x:pnx,y:pny});
  ctx.save();
  ctx.globalAlpha=liveStroke.opacity; ctx.strokeStyle=liveStroke.color;
  ctx.lineWidth=liveStroke.width; ctx.lineCap=ctx.lineJoin='round';
  ctx.beginPath(); ctx.moveTo(xy[0],xy[1]); ctx.restore();
}
function onMove(e) {
  if(!drawing) return;
  e.preventDefault();
  var xy=canvasXY(e), pnx=nx(xy[0]), pny=ny(xy[1]);
  if(tool.name==='eraser'){eraseAt(pnx,pny);return;}
  if(tool.name==='laser'){
    sendData({v:1,type:'pointer_move',uid:myId,x:pnx,y:pny,color:'#EF4444'});
    return;
  }
  if(liveShape){liveShape.x2=pnx;liveShape.y2=pny;redrawAll();return;}
  if(liveStroke){
    liveStroke.points.push([pnx,pny]);
    sendData({v:1,type:'stroke_point',uid:myId,pageId:currentPage,
              id:liveStroke.id,x:pnx,y:pny});
    var pts=liveStroke.points, len=pts.length;
    ctx.save();
    ctx.globalAlpha=liveStroke.opacity; ctx.strokeStyle=liveStroke.color;
    ctx.lineWidth=liveStroke.width; ctx.lineCap=ctx.lineJoin='round';
    ctx.beginPath();
    if(len===2){
      ctx.moveTo(dx(pts[0][0]),dy(pts[0][1]));
      ctx.lineTo(dx(pts[1][0]),dy(pts[1][1]));
    } else if(len>=3){
      var prev=pts[len-2],curr=pts[len-1];
      ctx.moveTo(dx(prev[0]),dy(prev[1]));
      ctx.quadraticCurveTo(dx(prev[0]),dy(prev[1]),
        (dx(prev[0])+dx(curr[0]))/2,(dy(prev[1])+dy(curr[1]))/2);
    }
    ctx.stroke(); ctx.restore();
  }
}
function onUp() {
  if(!drawing) return;
  drawing=false;
  if(tool.name==='laser'){sendData({v:1,type:'pointer_hide',uid:myId});return;}
  if(liveShape){
    var sel=Object.assign({},liveShape,{type:'shape'});
    pages[currentPage].elements.push(sel); undoStack.push(sel.id);
    sendData({v:1,type:'shape_add',uid:myId,pageId:currentPage,
              id:sel.id,shape:sel.shape,color:sel.color,width:sel.width,
              x1:sel.x1,y1:sel.y1,x2:sel.x2,y2:sel.y2});
    liveShape=null; redrawAll(); return;
  }
  if(liveStroke){
    pages[currentPage].elements.push(Object.assign({},liveStroke));
    undoStack.push(liveStroke.id);
    sendData({v:1,type:'stroke_end',uid:myId,pageId:currentPage,id:liveStroke.id});
    liveStroke=null; redrawAll();
  }
}

/* ── Data channel receive ───────────────────────────────────────────────────── */
function handleData(msg) {
  if(!msg||msg.v!==1) return;
  switch(msg.type){
    case 'mode_change': applyMode(msg.mode,false); break;
    case 'stroke_start':
      remoteStrokes[msg.id]={id:msg.id,type:'stroke',tool:msg.tool,
        color:msg.color,width:msg.width,opacity:msg.opacity||1,
        points:[[msg.x,msg.y]],pageId:msg.pageId};
      break;
    case 'stroke_point':{
      var rs=remoteStrokes[msg.id]; if(!rs) break;
      rs.points.push([msg.x,msg.y]);
      if(rs.pageId!==currentPage) break;
      var pts2=rs.points,len2=pts2.length;
      ctx.save();
      ctx.globalAlpha=rs.opacity;ctx.strokeStyle=rs.color;
      ctx.lineWidth=rs.width;ctx.lineCap=ctx.lineJoin='round';
      ctx.beginPath();
      if(len2===2){ctx.moveTo(dx(pts2[0][0]),dy(pts2[0][1]));ctx.lineTo(dx(pts2[1][0]),dy(pts2[1][1]));}
      else if(len2>=3){
        var p2=pts2[len2-2],p3=pts2[len2-1];
        ctx.moveTo(dx(p2[0]),dy(p2[1]));
        ctx.quadraticCurveTo(dx(p2[0]),dy(p2[1]),(dx(p2[0])+dx(p3[0]))/2,(dy(p2[1])+dy(p3[1]))/2);
      }
      ctx.stroke();ctx.restore();break;
    }
    case 'stroke_end':{
      var rs2=remoteStrokes[msg.id]; if(!rs2) break;
      var pg=pages[rs2.pageId]; if(pg) pg.elements.push(Object.assign({},rs2));
      delete remoteStrokes[msg.id];
      if(rs2.pageId===currentPage) redrawAll();
      break;
    }
    case 'stroke_erase':
      if(msg.pageId&&msg.ids){removeIds(msg.pageId,msg.ids);if(msg.pageId===currentPage)redrawAll();}
      break;
    case 'shape_add':{
      var spg=msg.pageId||currentPage;
      if(pages[spg]){
        pages[spg].elements.push({id:msg.id,type:'shape',shape:msg.shape,
          color:msg.color,width:msg.width,x1:msg.x1,y1:msg.y1,x2:msg.x2,y2:msg.y2});
        if(spg===currentPage) redrawAll();
      }
      break;
    }
    case 'text_add':{
      var tpg=msg.pageId||currentPage;
      if(pages[tpg]){
        pages[tpg].elements.push({id:msg.id,type:'text',text:msg.text,
          color:msg.color,size:msg.size,x:msg.x,y:msg.y});
        if(tpg===currentPage) redrawAll();
      }
      break;
    }
    case 'undo':
      Object.keys(pages).forEach(function(pid){
        pages[pid].elements=pages[pid].elements.filter(function(el){return el.id!==msg.id;});
      });
      redrawAll(); break;
    case 'clear':
      Object.keys(pages).forEach(function(pid){pages[pid].elements=[];});
      redrawAll(); break;
    case 'page_add':
      if(!pages[msg.pageId]){pages[msg.pageId]={elements:[]};pageOrder.push(msg.pageId);}
      switchPage(msg.pageId,false); renderPageBar(); break;
    case 'page_switch':
      if(pages[msg.pageId]) switchPage(msg.pageId,false); break;
    case 'pointer_move':{
      var pname=msg.uid;
      if(room){var rp2=room.remoteParticipants.get(msg.uid);if(rp2)pname=rp2.name||msg.uid;}
      showPointer(msg.uid,msg.x,msg.y,msg.color,pname); break;
    }
    case 'pointer_hide': hidePointer(msg.uid); break;
    case 'request_state':
      if(IS_TUTOR) sendData({v:1,type:'board_state',uid:myId,
                              pages:pages,pageOrder:pageOrder,currentPage:currentPage});
      break;
    case 'board_state':
      pages=msg.pages||{}; pageOrder=msg.pageOrder||Object.keys(pages);
      currentPage=msg.currentPage||pageOrder[0];
      if(!pages[currentPage]) currentPage=Object.keys(pages)[0];
      renderPageBar(); redrawAll(); break;
  }
}

/* ── Data channel send ──────────────────────────────────────────────────────── */
function sendData(msg) {
  if(!room) return;
  try{
    var bytes=new TextEncoder().encode(JSON.stringify(msg));
    room.localParticipant.publishData(bytes,{reliable:true});
  } catch(_){}
}

    sw.className='tb-swatch'+(tool.color===c?' active':'');

    sw.addEventListener('click',function(){
      tool.color=c;
      document.getElementById('text-input').style.color=c;
      buildToolbar();
    });
    tb.appendChild(sw);
  });
  mkSep();
  var undoBtn=document.createElement('button');
  undoBtn.className='tb-btn'; undoBtn.title='Undo';
  undoBtn.innerHTML='<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8a5 5 0 1 1 1.5 3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><polyline points="3,5 3,9 7,9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

function selectTool(name){
  tool.name=name;
  canvas.style.cursor={eraser:'cell',text:'text'}[name]||'crosshair';
  buildToolbar();
}
function doUndo(){
  if(!undoStack.length) return;
  var id=undoStack.pop();
  Object.keys(pages).forEach(function(pid){
    pages[pid].elements=pages[pid].elements.filter(function(el){return el.id!==id;});
  });
  sendData({v:1,type:'undo',uid:myId,id:id}); redrawAll();
}

/* ── LiveKit room ───────────────────────────────────────────────────────────── */
if(!window.LivekitClient){
  console.error('[Classroom] LiveKit SDK not loaded');
  post({type:'error',message:'Could not load the video engine. Please check your connection and try again.'});
  setStatus('Failed to load video engine');
  return;
}

console.log('[Classroom] LiveKit SDK loaded successfully');
var LK = window.LivekitClient;
room = new LK.Room({ adaptiveStream:true, dynacast:true });

room
  .on(LK.RoomEvent.TrackSubscribed, function(track,_pub,participant){
    attachTrack(participant.identity,track,false);
  })
  .on(LK.RoomEvent.TrackUnsubscribed, function(track,_pub,participant){
    detachTrack(participant.identity,track);
  })
  .on(LK.RoomEvent.LocalTrackPublished, function(pub,participant){
    if(pub.track) attachTrack(participant.identity,pub.track,true);
  })
  .on(LK.RoomEvent.LocalTrackUnpublished, function(pub,participant){
    if(pub.track) detachTrack(participant.identity,pub.track);
  })
  .on(LK.RoomEvent.TrackMuted, function(pub,participant){
    var t=tiles[participant.identity];
    if(t&&t.el._micIcon&&pub.kind===LK.Track.Kind.Audio){
      t.el._micIcon.style.display='inline';
    }
  })
  .on(LK.RoomEvent.TrackUnmuted, function(pub,participant){
    var t=tiles[participant.identity];
    if(t&&t.el._micIcon&&pub.kind===LK.Track.Kind.Audio){
      t.el._micIcon.style.display='none';
    }
  })
  .on(LK.RoomEvent.ParticipantConnected, function(participant){
    ensureTile(participant.identity,participant.name||participant.identity,false);
    setStatus('');
    if(IS_TUTOR) sendData({v:1,type:'board_state',uid:myId,
                            pages:pages,pageOrder:pageOrder,currentPage:currentPage});
  })
  .on(LK.RoomEvent.ParticipantDisconnected, function(participant){
    removeTile(participant.identity); hidePointer(participant.identity);
  })
  .on(LK.RoomEvent.DataReceived, function(data,participant){
    try{ handleData(JSON.parse(new TextDecoder().decode(data))); }catch(_){}
  })
  .on(LK.RoomEvent.Disconnected, function(reason){
    post({type:'disconnected',reason:reason?String(reason):undefined});
  })
  .on(LK.RoomEvent.ConnectionStateChanged, function(state){
    console.log('[Classroom] Connection state changed:', state);
    if(state===LK.ConnectionState.Reconnecting) setStatus('Reconnecting…');
    else if(state===LK.ConnectionState.Connected) {
      setStatus('');
      console.log('[Classroom] Connection established');
    }
    else if(state===LK.ConnectionState.Disconnected) {
      console.log('[Classroom] Connection lost');
      post({type:'error',message:'Connection lost. Please try again.'});
    }
  });

(async function main(){
  // Add connection timeout
  const connectionTimeout = setTimeout(() => {
    console.error('[Classroom] Connection timeout after 30 seconds');
    post({type:'error',message:'Connection timeout. Please check your internet connection and try again.'});
  }, 30000);

  try {
    console.log('[Classroom] Starting initialization...');
    console.log('[Classroom] Config check:', {
      hasLivekitUrl: !!LIVEKIT_URL,
      hasToken: !!TOKEN,
      livekitUrlLength: (LIVEKIT_URL||'').length,
      tokenLength: (TOKEN||'').length
    });
    
    canvas = document.getElementById('board-canvas');
    ctx    = canvas.getContext('2d');
    W = window.innerWidth; H = window.innerHeight;
    canvas.width=W; canvas.height=H;
    initPages(); buildToolbar();
    canvas.addEventListener('pointerdown',  onDown, {passive:false});
    canvas.addEventListener('pointermove',  onMove, {passive:false});
    canvas.addEventListener('pointerup',    onUp);
    canvas.addEventListener('pointercancel',onUp);
    window.addEventListener('resize', resizeCanvas);

    // ── Pre-connection media test ───────────────────────────────────────
    console.log('[Classroom] Testing getUserMedia access...');
    setStatus('Testing camera and microphone access...');
    
    try {
      const testStream = await navigator.mediaDevices.getUserMedia({ 
        video: true, 
        audio: true 
      });
      console.log('[Classroom] ✓ getUserMedia successful');
      console.log('[Classroom] Video tracks:', testStream.getVideoTracks().length);
      console.log('[Classroom] Audio tracks:', testStream.getAudioTracks().length);
      
      // Log device capabilities
      testStream.getVideoTracks().forEach((track, i) => {
        console.log(`[Classroom] Video track ${i}:`, track.label, track.getSettings());
      });
      testStream.getAudioTracks().forEach((track, i) => {
        console.log(`[Classroom] Audio track ${i}:`, track.label, track.getSettings());
      });
      
      // Stop test stream
      testStream.getTracks().forEach(track => track.stop());
    } catch (mediaErr) {
      console.error('[Classroom] ✗ getUserMedia failed:', mediaErr);
      console.error('[Classroom] Media error details:', {
        name: mediaErr.name,
        message: mediaErr.message,
        constraint: mediaErr.constraint
      });
      
      // Still try to continue but warn user
      post({type:'error',message:`Camera/microphone access denied: ${mediaErr.message}`});
    }

    console.log('[Classroom] Connecting to LiveKit:', LIVEKIT_URL);
    setStatus('Connecting to video server...');
    
    // Set up connection timeout and retry mechanism
    let connectionAttempts = 0;
    const maxAttempts = 3;
    
    async function attemptConnection() {
      connectionAttempts++;
      console.log(`[Classroom] Connection attempt ${connectionAttempts}/${maxAttempts}`);
      
      try {
        await room.connect(LIVEKIT_URL, TOKEN);
        return true;
      } catch (err) {
        console.error(`[Classroom] Connection attempt ${connectionAttempts} failed:`, err);
        if (connectionAttempts < maxAttempts) {
          console.log('[Classroom] Retrying in 2 seconds...');
          await new Promise(resolve => setTimeout(resolve, 2000));
          return attemptConnection();
        }
        throw err;
      }
    }
    
    await attemptConnection();
    myId = room.localParticipant.identity;
    console.log('[Classroom] Connected with identity:', myId);
    
    clearTimeout(connectionTimeout);

    ensureTile(myId, DISPLAY_NAME, true);
    room.remoteParticipants.forEach(function(participant){
      console.log('[Classroom] Found remote participant:', participant.identity);
      ensureTile(participant.identity,participant.name||participant.identity,false);
      participant.trackPublications.forEach(function(pub){
        if(pub.track) attachTrack(participant.identity,pub.track,false);
      });
    });

    console.log('[Classroom] Enabling microphone...');
    setStatus('Setting up audio...');
    try {
      await room.localParticipant.setMicrophoneEnabled(micOn);
      console.log('[Classroom] ✓ Microphone enabled successfully');
    } catch(err) {
      console.error('Failed to enable microphone:', err);
      console.error('Microphone error details:', {
        name: err.name,
        message: err.message,
        code: err.code
      });
      
      // Try enabling with different constraints
      try {
        console.log('[Classroom] Retrying microphone with basic constraints...');
        await room.localParticipant.setMicrophoneEnabled(true);
        console.log('[Classroom] ✓ Microphone enabled on retry');
      } catch(retryErr) {
        console.error('[Classroom] Microphone retry also failed:', retryErr);
        post({type:'warning',message:`Microphone access failed: ${err.message}`});
      }
    }
    
    console.log('[Classroom] Enabling camera...');
    setStatus('Setting up video...');
    try {
      await room.localParticipant.setCameraEnabled(camOn);
      console.log('[Classroom] ✓ Camera enabled successfully');
    } catch(err) {
      console.error('Failed to enable camera:', err);
      console.error('Camera error details:', {
        name: err.name,
        message: err.message,
        code: err.code
      });
      
      // Try enabling with different constraints
      try {
        console.log('[Classroom] Retrying camera with basic constraints...');
        await room.localParticipant.setCameraEnabled(true);
        console.log('[Classroom] ✓ Camera enabled on retry');
      } catch(retryErr) {
        console.error('[Classroom] Camera retry also failed:', retryErr);
        post({type:'warning',message:`Camera access failed: ${err.message}`});
      }
    }

    if(!IS_TUTOR) sendData({v:1,type:'request_state',uid:myId});

    document.getElementById('connecting').style.display='none';
    console.log('[Classroom] Ready!');
    post({type:'connected'});
  } catch(err){
    clearTimeout(connectionTimeout);
    console.error('[Classroom] Connection error:', err);
    console.error('[Classroom] Error details:', {
      name: err.name,
      message: err.message, 
      stack: err.stack
    });
    document.getElementById('connecting').style.display='none';
    post({type:'error',message:(err&&err.message)||'Could not connect to the session.'});
  }
})();

} /* end run() */

boot();
})();
</script>
</body>
</html>
