<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8"/>
<title>LiveKit Connection Test</title>
<style>
body { font-family: -apple-system, sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
.status { padding: 10px; margin: 10px 0; border-radius: 5px; }
.success { background: #d4edda; color: #155724; }
.error { background: #f8d7da; color: #721c24; }
.info { background: #d1ecf1; color: #0c5460; }
button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
button:hover { background: #0056b3; }
pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow-x: auto; }
</style>
</head>
<body>

<h1>LiveKit Connection Diagnostic</h1>

<div id="status-sdk" class="status info">Checking LiveKit SDK...</div>
<div id="status-config" class="status info">Config not loaded</div>
<div id="status-connection" class="status info">Not connected</div>

<h3>Test Configuration</h3>
<label>LiveKit URL:</label><br>
<input type="text" id="livekit-url" placeholder="wss://..." style="width: 100%; padding: 5px; margin: 5px 0;" 
       value="wss://didaskey-b320v6cw.livekit.cloud"><br>

<label>Token (get from backend):</label><br>
<textarea id="token" placeholder="JWT token here..." style="width: 100%; height: 100px; padding: 5px; margin: 5px 0;"></textarea><br>

<button onclick="testConnection()">Test Connection</button>
<button onclick="generateTestToken()">Generate Test Token (requires backend)</button>

<h3>Console Output</h3>
<pre id="console-output"></pre>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.13.4/dist/livekit-client.umd.min.js"></script>

<script>
let consoleOutput = '';
const originalLog = console.log;
const originalError = console.error;

console.log = function(...args) {
  originalLog.apply(console, args);
  consoleOutput += '[LOG] ' + args.join(' ') + '\n';
  updateConsole();
};

console.error = function(...args) {
  originalError.apply(console, args);
  consoleOutput += '[ERROR] ' + args.join(' ') + '\n';
  updateConsole();
};

function updateConsole() {
  document.getElementById('console-output').textContent = consoleOutput;
}

function setStatus(id, message, type = 'info') {
  const el = document.getElementById(id);
  el.textContent = message;
  el.className = 'status ' + type;
}

// Check if LiveKit SDK loaded
setTimeout(() => {
  if (window.LivekitClient) {
    setStatus('status-sdk', '✓ LiveKit SDK loaded successfully (v' + (window.LivekitClient.version || 'unknown') + ')', 'success');
    console.log('LiveKit SDK available:', Object.keys(window.LivekitClient));
  } else {
    setStatus('status-sdk', '✗ LiveKit SDK failed to load', 'error');
  }
}, 1000);

async function generateTestToken() {
  try {
    console.log('Requesting test token from backend...');
    
    // This would need a real booking ID and auth token
    // For now, just show instructions
    alert('To get a test token:\n\n1. Create a booking in the app\n2. Use the join classroom API to get a token\n3. Paste it in the text area above');
    
  } catch (err) {
    console.error('Failed to generate token:', err);
    setStatus('status-config', '✗ Failed to generate token: ' + err.message, 'error');
  }
}

async function testConnection() {
  const livekitUrl = document.getElementById('livekit-url').value.trim();
  const token = document.getElementById('token').value.trim();
  
  if (!livekitUrl || !token) {
    alert('Please enter both LiveKit URL and token');
    return;
  }
  
  if (!window.LivekitClient) {
    setStatus('status-connection', '✗ LiveKit SDK not available', 'error');
    return;
  }
  
  try {
    console.log('Testing connection to:', livekitUrl);
    setStatus('status-config', '✓ Config provided', 'success');
    setStatus('status-connection', '⏳ Connecting...', 'info');
    
    const LK = window.LivekitClient;
    const room = new LK.Room({ 
      adaptiveStream: true, 
      dynacast: true 
    });
    
    // Add event listeners
    room.on(LK.RoomEvent.Connected, () => {
      console.log('✓ Connected to room');
      setStatus('status-connection', '✓ Connected successfully!', 'success');
    });
    
    room.on(LK.RoomEvent.Disconnected, (reason) => {
      console.log('Disconnected:', reason);
      setStatus('status-connection', 'Disconnected: ' + reason, 'error');
    });
    
    room.on(LK.RoomEvent.ConnectionStateChanged, (state) => {
      console.log('Connection state:', state);
      if (state === LK.ConnectionState.Reconnecting) {
        setStatus('status-connection', '⏳ Reconnecting...', 'info');
      }
    });
    
    // Add connection timeout
    const timeout = setTimeout(() => {
      console.error('Connection timeout after 30 seconds');
      setStatus('status-connection', '✗ Connection timeout (30s)', 'error');
      room.disconnect();
    }, 30000);
    
    await room.connect(livekitUrl, token);
    clearTimeout(timeout);
    
    console.log('Local participant identity:', room.localParticipant.identity);
    console.log('Room name:', room.name);
    console.log('Remote participants:', room.remoteParticipants.size);
    
  } catch (err) {
    console.error('Connection failed:', err);
    setStatus('status-connection', '✗ Connection failed: ' + err.message, 'error');
  }
}
</script>

</body>
</html>
